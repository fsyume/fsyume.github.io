name: Deploy Blog

# 发布 GitHub Pages（国外线路）。
# 国内线路已迁移至腾讯云 EdgeOne Pages：在 EdgeOne 控制台「导入 Git 仓库」接入本仓库，
# push 后由 EdgeOne 自行拉取并构建（构建命令 npm run docs:build，产物目录
# docs/.vitepress/dist，图片已随 dist/images 一并产出），故本 workflow 不含国内部署步骤。
# 国内/国外分流在 DNSPod 用「默认 / 境外」线路实现。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      # ---------- 发布到 GitHub Pages（国外线路） ----------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4