name: Deploy Blog

# 一条流水线双端发布：
#   国内线路 → 又拍云 CDN（云存储为源）
#   国外线路 → GitHub Pages
# 国内/国外分流在 DNSPod 用「默认 / 境外」线路实现，详见 README。
#
# 需在仓库 Settings → Secrets and variables → Actions 配置：
#   UPYUN_SERVICE  又拍云云存储服务名（如 fs-blog）
#   UPYUN_OPERATOR 操作员名
#   UPYUN_PASSWORD 操作员密码
# 未配置时自动跳过又拍云步骤，仅发布 GitHub Pages。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-blog
  cancel-in-progress: false

env:
  UPYUN_SERVICE: ${{ secrets.UPYUN_SERVICE }}
  UPYUN_OPERATOR: ${{ secrets.UPYUN_OPERATOR }}
  UPYUN_PASSWORD: ${{ secrets.UPYUN_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      # ---------- 发布到 GitHub Pages（国外线路） ----------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      # ---------- 同步到又拍云（国内线路） ----------
      - name: Install upx
        if: ${{ env.UPYUN_SERVICE != '' }}
        run: |
          curl -fsSL https://collection.b0.upaiyun.com/softwares/upx/upx_0.4.9_linux_amd64.tar.gz | tar xz
          sudo mv upx /usr/local/bin/upx

      - name: Deploy to Upyun
        if: ${{ env.UPYUN_SERVICE != '' }}
        run: |
          AUTH=$(upx auth "$UPYUN_SERVICE" "$UPYUN_OPERATOR" "$UPYUN_PASSWORD")
          # 增量同步并删除远端多余文件（确保该服务专用于本站）
          upx --auth="$AUTH" sync docs/.vitepress/dist / --delete

      - name: Purge Upyun CDN cache
        if: ${{ env.UPYUN_SERVICE != '' }}
        continue-on-error: true
        run: |
          AUTH=$(upx auth "$UPYUN_SERVICE" "$UPYUN_OPERATOR" "$UPYUN_PASSWORD")
          find docs/.vitepress/dist -name '*.html' -printf 'https://www.fsyume.com/%P\n' \
            | sed 's#/index.html$#/#' > purge-urls.txt
          upx --auth="$AUTH" purge --list purge-urls.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4